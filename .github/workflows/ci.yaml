name: Build

on:
  push:
    branches: []
  pull_request:
    branches: []

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  all:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    name: All

    strategy:
      matrix:
        target:
        - x86_64-unknown-linux-gnu
        - aarch64-apple-darwin
        include:
        - target: x86_64-unknown-linux-gnu
          os:     ubuntu-latest
        - target: aarch64-apple-darwin
          os:     macos-latest

    runs-on: ${{matrix.os}}

    env:
      RUSTFLAGS: "-D warnings"

    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy

    - name: Info
      run: |
        rustup --version
        cargo --version
        cargo clippy --version
    
    - name: Build (Debug)
      run: |
        cargo build --target ${{ matrix.target }}

    - name: Build (Release)
      run: |
        cargo build --release --target ${{ matrix.target }}

    - name: Clippy
      run: |
        cargo clippy --workspace --release --target ${{ matrix.target }}

    - name: Test (Debug)
      run: |
        cargo test --workspace --target ${{ matrix.target }}

    - name: Test (Release)
      run: |
        cargo test --workspace --target ${{ matrix.target }}
        cargo test --workspace --release --target ${{ matrix.target }}
