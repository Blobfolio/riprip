name: Build

on:
  push:
    branches: []
  pull_request:
    branches: []

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  all:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    name: All

    strategy:
      matrix:
        target:
        - x86_64-unknown-linux-gnu
        - aarch64-apple-darwin
        - x86_64-pc-windows-msvc
        include:
        - target: x86_64-unknown-linux-gnu
          os:     ubuntu-latest
          rustflags: "-D warnings"
        - target: aarch64-apple-darwin
          os:     macos-latest
          rustflags: "-D warnings"
        - target: x86_64-pc-windows-msvc
          os:     windows-latest
          rustflags: "-D warnings -C target-feature=+crt-static"

    runs-on: ${{matrix.os}}

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy

    - name: Info
      run: |
        rustup --version
        cargo --version
        cargo clippy --version

    - name: Build (Debug)
      run: |
        cargo build --target ${{ matrix.target }}

    - name: Build (Release)
      run: |
        cargo build --release --target ${{ matrix.target }}

    - name: Windows CLI Smoke Test
      if: runner.os == 'Windows'
      run: |
        target/${{ matrix.target }}/release/riprip.exe --version
        target/${{ matrix.target }}/release/riprip.exe --help

    - name: Clippy
      run: |
        cargo clippy --release --target ${{ matrix.target }}

    - name: Test (Debug)
      run: |
        cargo test --target ${{ matrix.target }}

    - name: Test (Release)
      run: |
        cargo test --target ${{ matrix.target }}
        cargo test --release --target ${{ matrix.target }}

    - name: Build (Vendored)
      run: |
        cargo clean
        mkdir -p .cargo
        cargo vendor --locked >> .cargo/config.toml
        cargo build --locked --offline --target ${{ matrix.target }}
