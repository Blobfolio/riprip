name: Build

on:
  push:
    branches: []
  pull_request:
    branches: []

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  all:
    name: All

    strategy:
      matrix:
        target:
        - aarch64-apple-darwin
        include:
        - target: aarch64-apple-darwin
          os:     macos-latest

    runs-on: ${{matrix.os}}

    env:
      RUSTFLAGS: "-D warnings"

    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
        components: clippy

    - name: Info
      run: |
        rustup --version
        cargo --version
        cargo clippy --version

    - name: Build
      run: |
        cargo build --no-default-features --features=libusb --target ${{ matrix.target }}
        cargo build --release --no-default-features --features=libusb --target ${{ matrix.target }}

    - name: Clippy
      run: |
        cargo clippy --release -p riprip --no-default-features --features=libusb --target ${{ matrix.target }}
        cargo clippy --release -p riprip_core --features=libusb --target ${{ matrix.target }}
        cargo clippy --release -p riprip_core --features=libusb,bin --target ${{ matrix.target }}

    - name: Tests (Debug)
      run: |
        cargo test -p riprip --no-default-features --features=libusb --target ${{ matrix.target }}
        cargo test -p riprip_core --features=libusb --target ${{ matrix.target }}
        cargo test -p riprip_core --features=libusb,bin --target ${{ matrix.target }}

    - name: Tests (Release)
      run: |
        cargo test --release -p riprip --no-default-features --features=libusb --target ${{ matrix.target }}
        cargo test --release -p riprip_core --features=libusb --target ${{ matrix.target }}
        cargo test --release -p riprip_core --features=libusb,bin --target ${{ matrix.target }}
