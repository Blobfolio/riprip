[package]
name = "riprip_core"
version = "0.10.1"
license = "WTFPL"
authors = ["Josh Stoik <josh@blobfolio.com>"]
edition = "2024"
description = "The library for Rip Rip Hooray."
repository = "https://github.com/Blobfolio/riprip"
readme = "README.md"
publish = false

[dependencies]
cdtoc =       { workspace = true, features = ["accuraterip", "cddb", "ctdb", "musicbrainz"] }
crc32fast =   { workspace = true }
dactyl =      { workspace = true }
encoding_rs = { workspace = true }
fyi_msg =     { workspace = true }
minreq =      { workspace = true }
oxford_join = { workspace = true }
tempfile =    { workspace = true }
trimothy =    { workspace = true }
utc2k =       { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies.rustix]
version = "1.1.*"
features = [ "fs" ]

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31.*", features = ["fs", "user"] }
objc2-io-kit = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = [ "CFBase", "CFDictionary", "CFNumber", "CFString" ] }
rusb = "0.9.*"

[build-dependencies]
cdtoc =       { workspace = true, features = ["accuraterip"] }
dactyl =      { workspace = true }
oxford_join = { workspace = true }

[dev-dependencies]
fastrand = { workspace = true }
