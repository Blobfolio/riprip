[package]
name = "riprip_core"
version = "0.5.10"
license = "WTFPL"
authors = ["Josh Stoik <josh@blobfolio.com>"]
edition = "2024"
description = "The library for Rip Rip Hooray."
repository = "https://github.com/Blobfolio/riprip"
readme = "README.md"
publish = false

[dependencies]
cdtoc = "0.14.*"
crc32fast = "1.5.*"
dactyl = "0.13.*"
oxford_join = "0.7.*"
tempfile = "3.8.0"
trimothy = "0.9.*"
utc2k = "0.20.*"

[dependencies.fyi_msg]
version = "2.7.*"
features = [ "signals" ]

[dependencies.libcdio-sys]
version = "=3.0.0"
default-features = false
optional = true

[dependencies.minreq]
version = "3.0.*"
default-features = false
features = [ "https" ]

[build-dependencies]
dactyl = "0.13.*"
oxford_join = "0.7.*"

[build-dependencies.cdtoc]
version = "0.14.*"
default-features = false
features = [ "accuraterip" ]

[build-dependencies.minreq]
version = "3.0.*"
default-features = false
features = [ "https" ]

[dev-dependencies]
fastrand = "2"

[features]
default = [ "libcdio" ]

# This feature adds a few generic RipRipError types for the binary.
# It is not something external crates need to worry about.
bin = []

# Use libcdio driver. (Currently required.)
libcdio = [ "libcdio-sys" ]

# Build and link libcdio statically.
libcdio-static = [ "libcdio", "libcdio-sys/vendored" ]
