[package]
name = "riprip_core"
version = "0.5.8"
license = "WTFPL"
authors = ["Josh Stoik <josh@blobfolio.com>"]
edition = "2024"
description = "The library for Rip Rip Hooray."
repository = "https://github.com/Blobfolio/riprip"
readme = "README.md"
publish = false

[dependencies]
cdtoc = "0.13.*"
crc32fast = "=1.5.0"
dactyl = "0.13.*"
oxford_join = "0.7.*"
tempfile = "3.8.0"
trimothy = "0.9.*"
utc2k = "0.20.*"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-io-kit = { version = "0.3.2", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true, features = [ "CFBase", "CFDictionary", "CFNumber", "CFString" ] }

[dependencies.fyi_msg]
version = "2.6.*"
features = [ "signals" ]

[dependencies.libcdio-sys]
version = "=2.0.0"
default-features = false
optional = true

[dependencies.rusb]
version = "0.9.4"
optional = true

[dependencies.nix]
version = "0.31.3"
features = ["user"]
optional = true

[dependencies.crc]
version = "3.4.0"
optional = true

[dependencies.encoding_rs]
version = "0.8.35"
optional = true

[dependencies.minreq]
version = "3.0.0-rc.0"
default-features = false
features = [ "https" ]

[build-dependencies]
dactyl = "0.13.*"
oxford_join = "0.7.*"

[build-dependencies.cdtoc]
version = "0.13.*"
default-features = false
features = [ "accuraterip" ]

[build-dependencies.minreq]
version = "3.0.0-rc.0"
default-features = false
features = [ "https" ]

[dev-dependencies]
fastrand = "2"

[features]
default = []

# This feature adds a few generic RipRipError types for the binary.
# It is not something external crates need to worry about.
bin = []
cdio = [
    "dep:libcdio-sys"
]
usb = [
    "dep:objc2-io-kit",
    "dep:objc2-core-foundation",
    "dep:rusb",
    "dep:nix",
    "dep:crc",
    "dep:encoding_rs",
]
