[package]
name = "riprip_core"
version = "0.9.1"
license = "WTFPL"
authors = ["Josh Stoik <josh@blobfolio.com>"]
edition = "2024"
description = "The library for Rip Rip Hooray."
repository = "https://github.com/Blobfolio/riprip"
readme = "README.md"
publish = false

[dependencies]
cdtoc = "0.14.*"
crc32fast = "1.5.*"
dactyl = "0.14.*"
encoding_rs = "0.8.*"
tempfile = "3.8.0"
trimothy = "0.10.*"
utc2k = "0.21.*"

[dependencies.fyi_msg]
version = "2.7.*"
features = [ "signals" ]

[dependencies.minreq]
version = "3.0.*"
default-features = false
features = [ "https" ]

[dependencies.oxford_join]
version = "0.8.*"

[target.'cfg(target_os = "linux")'.dependencies.rustix]
version = "1.1.*"
features = [ "fs" ]

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31.*", features = ["fs", "user"] }
objc2-io-kit = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = [ "CFBase", "CFDictionary", "CFNumber", "CFString" ] }
rusb = "0.9.*"

[build-dependencies]
dactyl = "0.14.*"
oxford_join = "0.8.*"

[build-dependencies.cdtoc]
version = "0.14.*"
default-features = false
features = [ "accuraterip" ]

[dev-dependencies]
fastrand = "2"
