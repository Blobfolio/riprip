[package]
name = "riprip_core"
version = "0.9.1"
license = "WTFPL"
authors = ["Josh Stoik <josh@blobfolio.com>"]
edition = "2024"
description = "The library for Rip Rip Hooray."
repository = "https://github.com/Blobfolio/riprip"
readme = "README.md"
publish = false

[dependencies]
cdtoc = "0.14.*"
crc32fast = "1.5.*"
dactyl = "0.14.*"
encoding_rs = "0.8.*"
tempfile = "3.8.0"
trimothy = "0.10.*"
utc2k = "0.21.*"

[dependencies.fyi_msg]
version = "2.7.*"
features = [ "signals" ]

[dependencies.libc]
version = "0.2.*"
optional = true

[dependencies.libcdio-sys]
version = "=3.0.0"
default-features = false
optional = true

[dependencies.rusb]
version = "0.9.*"
optional = true

[dependencies.nix]
version = "0.31.*"
features = ["fs", "user"]
optional = true

[dependencies.minreq]
version = "3.0.*"
default-features = false
features = [ "https" ]

[dependencies.oxford_join]
version = "0.8.*"
optional = true

[dependencies.rustix]
version = "1.1.*"
optional = true
features = [ "fs" ]

[target.'cfg(target_os = "macos")'.dependencies.objc2-io-kit]
version = "0.3.2"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3.2"
features = [ "CFBase", "CFDictionary", "CFNumber", "CFString" ]
optional = true

[build-dependencies]
dactyl = "0.14.*"
oxford_join = "0.8.*"

[build-dependencies.cdtoc]
version = "0.14.*"
default-features = false
features = [ "accuraterip" ]

[dev-dependencies]
fastrand = "2"

[features]
default = []

# This feature adds a few generic RipRipError types for the binary.
bin = [ "oxford_join" ]

##
# Driver Choices (Mutually Exclusive).
##

# SG IO. [Linux]
sg_io = [ "rustix" ]

# Libusb. [Linux, macOS]
libusb = [
    "nix",
    "rusb",
    "objc2-io-kit",
    "objc2-core-foundation",
]

# Libcdio. [Linux, BSD]
libcdio = [ "libcdio-sys" ]
libcdio-static = [ "libcdio", "libcdio-sys/vendored" ]
